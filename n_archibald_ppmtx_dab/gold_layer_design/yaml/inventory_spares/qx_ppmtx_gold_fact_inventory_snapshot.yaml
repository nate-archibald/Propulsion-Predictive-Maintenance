table_name: qx_ppmtx_gold_fact_inventory_snapshot
entity_type: fact
domain: inventory_spares
grain: "One row per part instance (batch), representing current inventory position"
update_frequency: daily
fact_type: periodic_snapshot
description: "Current inventory position periodic snapshot fact. Business: provides real-time visibility into every propulsion spare across all conditions and stations, enabling stock-out risk identification, spare availability queries, and station-level positioning analysis for inventory planners. Technical: periodic snapshot fact sourced from Silver qx_ppmtx_pn_inventory_detail with surrogate key joins to dim_part, dim_aircraft, dim_station, and dim_date."
catalog: subject_maintenanceengineering
schema: an_maintenanceengineering_ods
clustering: auto
table_properties:
  delta.enableChangeDataFeed: "true"
  delta.enableRowTracking: "true"
  delta.autoOptimize.optimizeWrite: "true"
  delta.autoOptimize.autoCompact: "true"
  layer: "gold"
  domain: "inventory_spares"
  entity_type: "fact"
  grain: "batch"
  fact_type: "periodic_snapshot"

primary_key: ["fact_inventory_snapshot_key"]

foreign_keys:
  - columns: ["dim_part_key"]
    references: qx_ppmtx_gold_dim_part(dim_part_key)
    nullable: true
  - columns: ["dim_aircraft_key"]
    references: qx_ppmtx_gold_dim_aircraft(dim_aircraft_key)
    nullable: true
  - columns: ["dim_station_key"]
    references: qx_ppmtx_gold_dim_station(dim_station_key)
    nullable: true
  - columns: ["snapshot_date_key"]
    references: qx_ppmtx_gold_dim_date(dim_date_key)
    nullable: true

measures:
  - unit_cost

columns:
  - name: fact_inventory_snapshot_key
    data_type: BIGINT
    nullable: false
    description: "Surrogate key for inventory snapshot. Business: unique identifier for each inventory position record. Technical: generated via hash of batch."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: batch
      transformation: GENERATED
      transformation_logic: "HASH(batch)"

  - name: dim_part_key
    data_type: BIGINT
    nullable: true
    description: "Foreign key to part dimension. Business: the part number of this inventory item. Technical: lookup join on pn to dim_part."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: pn
      transformation: LOOKUP
      transformation_logic: "JOIN qx_ppmtx_gold_dim_part ON pn = dim_part.pn"

  - name: dim_aircraft_key
    data_type: BIGINT
    nullable: true
    description: "Foreign key to aircraft dimension. Business: identifies aircraft if part is currently installed. Technical: lookup join on installed_ac to dim_aircraft."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: installed_ac
      transformation: LOOKUP
      transformation_logic: "JOIN qx_ppmtx_gold_dim_aircraft ON installed_ac = dim_aircraft.ac"

  - name: dim_station_key
    data_type: BIGINT
    nullable: true
    description: "Foreign key to station dimension. Business: the station where this part is currently located. Technical: lookup join on location to dim_station."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: location
      transformation: LOOKUP
      transformation_logic: "JOIN qx_ppmtx_gold_dim_station ON location = dim_station.station_code"

  - name: snapshot_date_key
    data_type: INT
    nullable: true
    description: "Foreign key to date dimension for snapshot date. Business: the date this inventory position was captured. Technical: derived from processed_timestamp."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: processed_timestamp
      transformation: DERIVED_CALCULATION
      transformation_logic: "CAST(date_format(CAST(processed_timestamp AS DATE), 'yyyyMMdd') AS INT)"

  - name: batch
    data_type: DECIMAL
    nullable: false
    description: "Inventory batch number. Business: unique identifier for a specific part instance in inventory. Technical: natural key from Silver, grain column."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: batch
      transformation: DIRECT_COPY
      transformation_logic: "batch"

  - name: sn
    data_type: STRING
    nullable: true
    description: "Serial number. Business: the specific serialized part instance. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: sn
      transformation: DIRECT_COPY
      transformation_logic: "sn"

  - name: nha_pn
    data_type: STRING
    nullable: true
    description: "Next Higher Assembly part number. Business: the parent assembly this part belongs to. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: nha_pn
      transformation: DIRECT_COPY
      transformation_logic: "nha_pn"

  - name: nha_sn
    data_type: STRING
    nullable: true
    description: "Next Higher Assembly serial number. Business: the specific parent assembly instance. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: nha_sn
      transformation: DIRECT_COPY
      transformation_logic: "nha_sn"

  - name: condition
    data_type: STRING
    nullable: true
    description: "Part condition code. Business: current serviceability (SVC/RFI/UNS/SCR/AOG) critical for spare availability queries. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: condition
      transformation: DIRECT_COPY
      transformation_logic: "condition"

  - name: owner
    data_type: STRING
    nullable: true
    description: "Part owner. Business: who owns this part instance (airline, vendor, pool). Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: owner
      transformation: DIRECT_COPY
      transformation_logic: "owner"

  - name: unit_cost
    data_type: DECIMAL
    nullable: true
    description: "Unit cost of this part instance. Business: current value for inventory valuation and financial reporting. Technical: semi-additive measure from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: unit_cost
      transformation: DIRECT_COPY
      transformation_logic: "unit_cost"

  - name: currency
    data_type: STRING
    nullable: true
    description: "Cost currency. Business: currency denomination for the unit cost. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: currency
      transformation: DIRECT_COPY
      transformation_logic: "currency"

  - name: location
    data_type: STRING
    nullable: true
    description: "Storage location. Business: physical location of the part (station code or warehouse). Technical: attribute from Silver, also used for dim_station lookup."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: location
      transformation: DIRECT_COPY
      transformation_logic: "location"

  - name: installed_ac
    data_type: STRING
    nullable: true
    description: "Aircraft registration if installed. Business: which aircraft this part is currently on (null if in stock). Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: installed_ac
      transformation: DIRECT_COPY
      transformation_logic: "installed_ac"

  - name: installed_position
    data_type: STRING
    nullable: true
    description: "Installation position. Business: physical location on the aircraft where the part is installed. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_inventory_detail
      silver_column: installed_position
      transformation: DIRECT_COPY
      transformation_logic: "installed_position"
