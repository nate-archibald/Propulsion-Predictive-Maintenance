table_name: qx_ppmtx_gold_fact_teardown
entity_type: fact
domain: procurement_overhaul
grain: "One row per teardown report line item, identified by (order_type, order_number, order_line)"
update_frequency: daily
fact_type: transaction
description: "Component teardown and shop finding fact. Business: captures the results of component teardown inspections including fault confirmation, work performed, and shop findings, enabling root cause analysis and linking shop results back to originating defects. Technical: transaction fact sourced from Silver qx_ppmtx_pn_tear_down_report with surrogate key joins to dim_part, dim_ata_chapter, and dim_date."
catalog: subject_maintenanceengineering
schema: an_maintenanceengineering_ods
clustering: auto
table_properties:
  delta.enableChangeDataFeed: "true"
  delta.enableRowTracking: "true"
  delta.autoOptimize.optimizeWrite: "true"
  delta.autoOptimize.autoCompact: "true"
  layer: "gold"
  domain: "procurement_overhaul"
  entity_type: "fact"
  grain: "order_type + order_number + order_line"
  fact_type: "transaction"

primary_key: ["fact_teardown_key"]

foreign_keys:
  - columns: ["dim_part_key"]
    references: qx_ppmtx_gold_dim_part(dim_part_key)
    nullable: true
  - columns: ["dim_ata_chapter_key"]
    references: qx_ppmtx_gold_dim_ata_chapter(dim_ata_chapter_key)
    nullable: true
  - columns: ["created_date_key"]
    references: qx_ppmtx_gold_dim_date(dim_date_key)
    nullable: true

measures: []

columns:
  - name: fact_teardown_key
    data_type: BIGINT
    nullable: false
    description: "Surrogate key for teardown fact. Business: unique identifier for each teardown report record. Technical: generated via hash of (order_type, order_number, order_line)."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: order_number
      transformation: GENERATED
      transformation_logic: "HASH(order_type, order_number, order_line)"

  - name: dim_part_key
    data_type: BIGINT
    nullable: true
    description: "Foreign key to part dimension. Business: the part that was torn down. Technical: lookup join on pn to dim_part."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: pn
      transformation: LOOKUP
      transformation_logic: "JOIN qx_ppmtx_gold_dim_part ON pn = dim_part.pn"

  - name: dim_ata_chapter_key
    data_type: BIGINT
    nullable: true
    description: "Foreign key to ATA chapter dimension. Business: ATA classification of the teardown finding. Technical: lookup join on (chapter, section, paragraph) — uses defect-associated ATA from tear_down_report."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: null
      transformation: LOOKUP
      transformation_logic: "JOIN qx_ppmtx_gold_dim_ata_chapter via defect linkage chapter/section/paragraph"

  - name: created_date_key
    data_type: INT
    nullable: true
    description: "Foreign key to date dimension for report creation date. Business: when the teardown report was created. Technical: derived from created_date."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: created_date
      transformation: DERIVED_CALCULATION
      transformation_logic: "CAST(date_format(CAST(created_date AS DATE), 'yyyyMMdd') AS INT)"

  - name: order_type
    data_type: STRING
    nullable: false
    description: "Order type. Business: type of maintenance order (Repair, Overhaul). Technical: degenerate dimension, part of grain."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: order_type
      transformation: DIRECT_COPY
      transformation_logic: "order_type"

  - name: order_number
    data_type: DECIMAL
    nullable: false
    description: "Order number. Business: the repair/overhaul order this teardown is associated with. Technical: degenerate dimension, part of grain."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: order_number
      transformation: DIRECT_COPY
      transformation_logic: "order_number"

  - name: order_line
    data_type: DECIMAL
    nullable: false
    description: "Order line number. Business: line item within the order. Technical: degenerate dimension, part of grain."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: order_line
      transformation: DIRECT_COPY
      transformation_logic: "order_line"

  - name: sn
    data_type: STRING
    nullable: true
    description: "Serial number of the torn-down component. Business: the specific part instance that was inspected. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: sn
      transformation: DIRECT_COPY
      transformation_logic: "sn"

  - name: batch
    data_type: DECIMAL
    nullable: true
    description: "Inventory batch reference. Business: links to inventory for traceability. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: batch
      transformation: DIRECT_COPY
      transformation_logic: "batch"

  - name: fault_confirm
    data_type: STRING
    nullable: true
    description: "Fault confirmed indicator. Business: whether the reported fault was confirmed during teardown inspection, critical for reliability trending (NFF vs confirmed failure). Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: fault_confirm
      transformation: DIRECT_COPY
      transformation_logic: "fault_confirm"

  - name: status
    data_type: STRING
    nullable: true
    description: "Teardown report status. Business: processing state of the teardown. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: status
      transformation: DIRECT_COPY
      transformation_logic: "status"

  - name: pn_description
    data_type: STRING
    nullable: true
    description: "Part description. Business: name of the part as recorded on the teardown report. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: pn_description
      transformation: DIRECT_COPY
      transformation_logic: "pn_description"

  - name: work_done
    data_type: STRING
    nullable: true
    description: "Work performed description. Business: narrative of the repair/overhaul work completed during teardown. Technical: text attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: work_done
      transformation: DIRECT_COPY
      transformation_logic: "work_done"

  - name: shop_finding
    data_type: STRING
    nullable: true
    description: "Shop finding description. Business: the root cause finding from teardown inspection, critical for failure mode identification and Genie search. Technical: text attribute from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: shop_finding
      transformation: DIRECT_COPY
      transformation_logic: "shop_finding"

  - name: defect_type
    data_type: STRING
    nullable: true
    description: "Originating defect type. Business: links this teardown back to the originating defect for end-to-end traceability. Technical: degenerate dimension from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: defect_type
      transformation: DIRECT_COPY
      transformation_logic: "defect_type"

  - name: defect
    data_type: STRING
    nullable: true
    description: "Originating defect number. Business: specific defect that led to this teardown. Technical: degenerate dimension from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: defect
      transformation: DIRECT_COPY
      transformation_logic: "defect"

  - name: defect_item
    data_type: DECIMAL
    nullable: true
    description: "Originating defect item. Business: defect line item for multi-item defects. Technical: degenerate dimension from Silver."
    lineage:
      source_table: qx_ppmtx_pn_tear_down_report
      silver_column: defect_item
      transformation: DIRECT_COPY
      transformation_logic: "defect_item"
