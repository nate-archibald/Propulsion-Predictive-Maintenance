table_name: qx_ppmtx_gold_fact_order
entity_type: fact
domain: procurement_overhaul
grain: "One row per order line item, identified by (order_type, order_number, order_line)"
update_frequency: daily
fact_type: transaction
description: "Maintenance and repair order line item fact. Business: tracks procurement orders for propulsion parts including exchange/repair costs, quantities, and lead times enabling supply chain analytics, cost tracking, and order fulfillment monitoring. Technical: transaction fact sourced from Silver qx_ppmtx_order_detail with surrogate key joins to dim_part and dim_date."
catalog: subject_maintenanceengineering
schema: an_maintenanceengineering_ods
clustering: auto
table_properties:
  delta.enableChangeDataFeed: "true"
  delta.enableRowTracking: "true"
  delta.autoOptimize.optimizeWrite: "true"
  delta.autoOptimize.autoCompact: "true"
  layer: "gold"
  domain: "procurement_overhaul"
  entity_type: "fact"
  grain: "order_type + order_number + order_line"
  fact_type: "transaction"

primary_key: ["fact_order_key"]

foreign_keys:
  - columns: ["dim_part_key"]
    references: qx_ppmtx_gold_dim_part(dim_part_key)
    nullable: true
  - columns: ["order_date_key"]
    references: qx_ppmtx_gold_dim_date(dim_date_key)
    nullable: true

measures:
  - exchange_repair_cost
  - qty_require
  - qty_received
  - qty_available
  - lead_time

columns:
  - name: fact_order_key
    data_type: BIGINT
    nullable: false
    description: "Surrogate key for order fact. Business: unique identifier for each order line item. Technical: generated via hash of (order_type, order_number, order_line)."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: order_number
      transformation: GENERATED
      transformation_logic: "HASH(order_type, order_number, order_line)"

  - name: dim_part_key
    data_type: BIGINT
    nullable: true
    description: "Foreign key to part dimension. Business: the part being ordered. Technical: lookup join on pn to dim_part."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: pn
      transformation: LOOKUP
      transformation_logic: "JOIN qx_ppmtx_gold_dim_part ON pn = dim_part.pn"

  - name: order_date_key
    data_type: INT
    nullable: true
    description: "Foreign key to date dimension for order date. Business: when the order was placed. Technical: derived from processed_timestamp."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: processed_timestamp
      transformation: DERIVED_CALCULATION
      transformation_logic: "CAST(date_format(CAST(processed_timestamp AS DATE), 'yyyyMMdd') AS INT)"

  - name: order_type
    data_type: STRING
    nullable: false
    description: "Order type code. Business: type of procurement (Purchase, Repair, Exchange, Loan). Technical: degenerate dimension, part of grain."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: order_type
      transformation: DIRECT_COPY
      transformation_logic: "order_type"

  - name: order_number
    data_type: DECIMAL
    nullable: false
    description: "Order number. Business: unique order identifier in the procurement system. Technical: degenerate dimension, part of grain."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: order_number
      transformation: DIRECT_COPY
      transformation_logic: "order_number"

  - name: order_line
    data_type: DECIMAL
    nullable: false
    description: "Order line number. Business: line item sequence within the order. Technical: degenerate dimension, part of grain."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: order_line
      transformation: DIRECT_COPY
      transformation_logic: "order_line"

  - name: status
    data_type: STRING
    nullable: true
    description: "Order line status. Business: current processing state (Open, In Progress, Received, Closed). Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: status
      transformation: DIRECT_COPY
      transformation_logic: "status"

  - name: sn
    data_type: STRING
    nullable: true
    description: "Serial number of ordered part. Business: specific part instance being ordered or returned. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: sn
      transformation: DIRECT_COPY
      transformation_logic: "sn"

  - name: batch
    data_type: DECIMAL
    nullable: true
    description: "Inventory batch reference. Business: links to the inventory record for this part. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: batch
      transformation: DIRECT_COPY
      transformation_logic: "batch"

  - name: pn_description
    data_type: STRING
    nullable: true
    description: "Part description on order. Business: human-readable part name as it appears on the order. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: pn_description
      transformation: DIRECT_COPY
      transformation_logic: "pn_description"

  - name: exchange_pn
    data_type: STRING
    nullable: true
    description: "Exchange part number. Business: the part number received in exchange transactions. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: exchange_pn
      transformation: DIRECT_COPY
      transformation_logic: "exchange_pn"

  - name: exchange_sn
    data_type: STRING
    nullable: true
    description: "Exchange serial number. Business: the specific unit received in exchange. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: exchange_sn
      transformation: DIRECT_COPY
      transformation_logic: "exchange_sn"

  - name: exchange_repair_cost
    data_type: DECIMAL
    nullable: true
    description: "Exchange or repair cost. Business: total cost of the exchange or repair transaction for financial analysis. Technical: additive measure from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: exchange_repair_cost
      transformation: DIRECT_COPY
      transformation_logic: "exchange_repair_cost"

  - name: qty_require
    data_type: DECIMAL
    nullable: true
    description: "Quantity required. Business: how many units are needed. Technical: additive measure from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: qty_require
      transformation: DIRECT_COPY
      transformation_logic: "qty_require"

  - name: qty_received
    data_type: DECIMAL
    nullable: true
    description: "Quantity received. Business: how many units have been received against this order line. Technical: additive measure from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: qty_received
      transformation: DIRECT_COPY
      transformation_logic: "qty_received"

  - name: qty_available
    data_type: DECIMAL
    nullable: true
    description: "Quantity available. Business: units available to fulfill this order. Technical: additive measure from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: qty_available
      transformation: DIRECT_COPY
      transformation_logic: "qty_available"

  - name: lead_time
    data_type: DECIMAL
    nullable: true
    description: "Order lead time in days. Business: expected days from order to receipt for supply chain planning. Technical: additive measure from Silver."
    lineage:
      source_table: qx_ppmtx_order_detail
      silver_column: lead_time
      transformation: DIRECT_COPY
      transformation_logic: "lead_time"
