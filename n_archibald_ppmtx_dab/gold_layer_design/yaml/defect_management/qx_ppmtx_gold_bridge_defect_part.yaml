table_name: qx_ppmtx_gold_bridge_defect_part
entity_type: bridge
domain: defect_management
grain: "One row per part associated with a defect event, identified by (defect_type, defect, defect_item, item)"
description: "Bridge table linking defect events to implicated parts. Business: enables the critical defect-to-part linkage that no legacy tool supports, allowing reliability engineers to trace from a defect to the specific parts involved and from a part to all defects it was implicated in. Supports FR-5 confidence scoring. Technical: bridge fact sourced from Silver qx_ppmtx_defect_report_pn with FK to dim_part and composite FK to fact_defect."
catalog: subject_maintenanceengineering
schema: an_maintenanceengineering_ods
clustering: auto
table_properties:
  delta.enableChangeDataFeed: "true"
  delta.enableRowTracking: "true"
  delta.autoOptimize.optimizeWrite: "true"
  delta.autoOptimize.autoCompact: "true"
  layer: "gold"
  domain: "defect_management"
  entity_type: "bridge"
  grain: "defect_type + defect + defect_item + item"

primary_key: ["bridge_defect_part_key"]

foreign_keys:
  - columns: ["dim_part_key"]
    references: qx_ppmtx_gold_dim_part(dim_part_key)
    nullable: true
  - columns: ["defect_type", "defect", "defect_item"]
    references: qx_ppmtx_gold_fact_defect(defect_type, defect, defect_item)
    nullable: false

columns:
  - name: bridge_defect_part_key
    data_type: BIGINT
    nullable: false
    description: "Surrogate key for defect-part bridge. Business: unique identifier for each defect-to-part association. Technical: generated via hash of (defect_type, defect, defect_item, item)."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: defect
      transformation: GENERATED
      transformation_logic: "HASH(defect_type, defect, defect_item, item)"

  - name: dim_part_key
    data_type: BIGINT
    nullable: true
    description: "Foreign key to part dimension. Business: the part number implicated in this defect. Technical: lookup join on pn to dim_part."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: pn
      transformation: LOOKUP
      transformation_logic: "JOIN qx_ppmtx_gold_dim_part ON pn = dim_part.pn"

  - name: defect_type
    data_type: STRING
    nullable: false
    description: "Defect type code. Business: links back to the parent defect event. Technical: composite FK part 1 to fact_defect."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: defect_type
      transformation: DIRECT_COPY
      transformation_logic: "defect_type"

  - name: defect
    data_type: STRING
    nullable: false
    description: "Defect number. Business: links back to the parent defect event. Technical: composite FK part 2 to fact_defect."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: defect
      transformation: DIRECT_COPY
      transformation_logic: "defect"

  - name: defect_item
    data_type: DECIMAL
    nullable: false
    description: "Defect line item number. Business: links back to the parent defect event. Technical: composite FK part 3 to fact_defect."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: defect_item
      transformation: DIRECT_COPY
      transformation_logic: "defect_item"

  - name: item
    data_type: DECIMAL
    nullable: false
    description: "Part line item within the defect. Business: sequence number for multiple parts associated with one defect. Technical: degenerate dimension, part of grain."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: item
      transformation: DIRECT_COPY
      transformation_logic: "item"

  - name: qty
    data_type: DECIMAL
    nullable: true
    description: "Quantity required. Business: number of units of this part needed for defect resolution. Technical: measure from Silver."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: qty
      transformation: DIRECT_COPY
      transformation_logic: "qty"

  - name: qty_reserved
    data_type: DECIMAL
    nullable: true
    description: "Quantity reserved from inventory. Business: how many units have been reserved against available stock. Technical: measure from Silver."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: qty_reserved
      transformation: DIRECT_COPY
      transformation_logic: "qty_reserved"

  - name: spare
    data_type: STRING
    nullable: true
    description: "Spare designation flag. Business: indicates if this part line is designated as a spare replacement. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: spare
      transformation: DIRECT_COPY
      transformation_logic: "spare"

  - name: ipc
    data_type: STRING
    nullable: true
    description: "Illustrated Parts Catalog reference. Business: IPC reference for the part within the maintenance manual. Technical: attribute from Silver."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: ipc
      transformation: DIRECT_COPY
      transformation_logic: "ipc"

  - name: reserved
    data_type: STRING
    nullable: true
    description: "Reservation status. Business: whether inventory has been reserved for this defect resolution. Technical: flag from Silver."
    lineage:
      source_table: qx_ppmtx_defect_report_pn
      silver_column: reserved
      transformation: DIRECT_COPY
      transformation_logic: "reserved"
