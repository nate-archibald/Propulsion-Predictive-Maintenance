resources:
  jobs:
    qx_ppmtx_gold_merge_job:
      name: "qx_ppmtx Gold Layer Merge"
      # EDITABLE keeps the schedule/pause state changeable in the Databricks UI even
      # though the job is bundle-managed. (A `bundle deploy` still resets it to the
      # values below, so change the schedule here for a permanent change.)
      edit_mode: EDITABLE
      tags:
        environment: dev
        layer: gold
        job_type: merge
        project: qx_ppmtx
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Los_Angeles
        pause_status: UNPAUSED
      tasks:
        - task_key: merge_silver_to_gold
          notebook_task:
            notebook_path: ../../src/ppmtx_gold/merge_gold_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.silver_schema}
              silver_catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              bronze_catalog: ${var.bronze_catalog}
              bronze_schema: ${var.bronze_schema}
          environment_key: gold_env
        - task_key: refresh_synced_tables
          depends_on:
            - task_key: merge_silver_to_gold
          notebook_task:
            notebook_path: ../../src/ppmtx_gold/refresh_synced_tables.py
          environment_key: gold_env

      environments:
        - environment_key: gold_env
          spec:
            client: "1"
            dependencies:
              - pyyaml>=6.0
              - databricks-sdk
