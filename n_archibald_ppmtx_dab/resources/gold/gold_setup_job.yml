resources:
  jobs:
    qx_ppmtx_gold_setup_job:
      name: "qx_ppmtx Gold Layer Setup"
      tags:
        environment: dev
        layer: gold
        job_type: setup
        project: qx_ppmtx
      tasks:
        - task_key: create_tables
          notebook_task:
            notebook_path: ../../src/ppmtx_gold/setup_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.silver_schema}
              # Safety default: never recreate existing tables (would break every
              # Lakebase sync checkpoint reading them). Override only for a
              # deliberate, one-off full schema rebuild via a manual run with
              # force_recreate=true, and full-refresh affected syncs afterward.
              force_recreate: "false"
          environment_key: gold_env

        - task_key: add_fk_constraints
          depends_on:
            - task_key: create_tables
          notebook_task:
            notebook_path: ../../src/ppmtx_gold/add_fk_constraints.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.silver_schema}
          environment_key: gold_env

      environments:
        - environment_key: gold_env
          spec:
            client: "1"
            dependencies:
              - pyyaml>=6.0
