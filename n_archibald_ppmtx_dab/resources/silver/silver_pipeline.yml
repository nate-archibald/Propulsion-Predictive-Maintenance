resources:
  pipelines:
    qx_ppmtx_silver_pipeline:
      name: "qx_ppmtx Silver Layer Pipeline"
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      serverless: true
      photon: true
      edition: ADVANCED
      continuous: false
      development: true
      channel: CURRENT
      configuration:
        bronze_catalog: ${var.bronze_catalog}
        bronze_schema: ${var.bronze_schema}
      libraries:
        - notebook:
            path: ../../src/ppmtx_silver/silver_dimensions.py
        - notebook:
            path: ../../src/ppmtx_silver/silver_inventory.py
        - notebook:
            path: ../../src/ppmtx_silver/silver_orders_defects.py
        - notebook:
            path: ../../src/ppmtx_silver/data_quality_monitoring.py
        - file:
            path: ../../src/ppmtx_silver/dq_rules_loader.py
