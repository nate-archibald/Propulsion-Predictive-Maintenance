# =============================================================================
# Architecture
# =============================================================================
architecture:
  pattern: orchestrator-plus-workers
  orchestrator:
    name: "QX Predictive Maintenance Orchestrator"
    description: "Routes user queries to domain-specific agents via intent classification"
    genie_spaces:
      - "Propulsion Reliability Intelligence"
      - "Inventory & Supply Chain Intelligence"
    model_endpoint: databricks-claude-Opus-4-6
    memory:
      short_term: true
      long_term: true

# =============================================================================
# Domain Agents
# =============================================================================
agents:
  - name: "Component Lifecycle Agent"
    domain: component_lifecycle
    description: "Specialized agent for propulsion component removal trending, MTBUR analysis, and reliability metrics"
    genie_space: "Propulsion Reliability Intelligence"
    genie_space_id: "{to_be_filled_after_deployment}"
    use_case_refs: [UC-001, UC-010]
    capabilities:
      - "Answer component lifecycle and reliability questions via Genie"
      - "Provide MTBUR calculations and removal trending"
      - "Alert on unscheduled removal rate spikes"
    tools:
      - name: query_component_lifecycle_genie
        type: genie_conversation_api
        description: "Query Propulsion Reliability Intelligence Genie Space for component lifecycle questions"
      - name: get_component_lifecycle_alerts
        type: sql_query
        description: "Retrieve active REL-* alerts"
    sample_questions:
      - "What is the MTBUR for part 1234-5678?"
      - "Removal trend for HPT shrouds last 24 months?"
      - "Which tails have the most unscheduled removals?"

  - name: "Defect Intelligence Agent"
    domain: defect_intelligence
    description: "Specialized agent for defect trending, ATA hotspot analysis, operational impact, and defect-part linkage"
    genie_space: "Propulsion Reliability Intelligence"
    genie_space_id: "{to_be_filled_after_deployment}"
    use_case_refs: [UC-002, UC-003, UC-004, UC-010]
    capabilities:
      - "Answer defect trending and ATA hotspot questions via Genie"
      - "Trace defect-to-part-to-shop-finding linkage"
      - "Alert on IFSD events and defect rate anomalies"
    tools:
      - name: query_defect_intelligence_genie
        type: genie_conversation_api
        description: "Query Propulsion Reliability Intelligence Genie Space for defect questions"
      - name: get_defect_intelligence_alerts
        type: sql_query
        description: "Retrieve active DEFECT-* and DQ-* alerts"
    sample_questions:
      - "Top 5 ATA sections by delay minutes this month?"
      - "Trace parts linked to defect PIREP-12345"
      - "IFSD event trend over the last 12 months?"

  - name: "Inventory & Spares Agent"
    domain: inventory_spares
    description: "Specialized agent for spare positioning, LLP red-line tracking, and stock-out risk identification"
    genie_space: "Inventory & Supply Chain Intelligence"
    genie_space_id: "{to_be_filled_after_deployment}"
    use_case_refs: [UC-005, UC-006, UC-007]
    capabilities:
      - "Answer spare availability and inventory questions via Genie"
      - "Perform LLP red-line fleet scans"
      - "Identify stock-out risk and AOG situations"
    tools:
      - name: query_inventory_spares_genie
        type: genie_conversation_api
        description: "Query Inventory & Supply Chain Intelligence Genie Space for inventory questions"
      - name: get_inventory_spares_alerts
        type: sql_query
        description: "Retrieve active INV-* alerts"
    sample_questions:
      - "LLPs with fewer than 1,000 cycles remaining?"
      - "Serviceable spares of P/N X at PDX?"
      - "Which parts have stock-out risk?"

  - name: "Procurement & Overhaul Agent"
    domain: procurement_overhaul
    description: "Specialized agent for order tracking, repair cost analytics, and shop finding root cause analysis"
    genie_space: "Inventory & Supply Chain Intelligence"
    genie_space_id: "{to_be_filled_after_deployment}"
    use_case_refs: [UC-008, UC-009]
    capabilities:
      - "Answer procurement and repair order questions via Genie"
      - "Analyze shop findings and fault confirmation rates"
      - "Track order fulfillment and lead times"
    tools:
      - name: query_procurement_overhaul_genie
        type: genie_conversation_api
        description: "Query Inventory & Supply Chain Intelligence Genie Space for procurement questions"
      - name: get_procurement_overhaul_alerts
        type: sql_query
        description: "Retrieve active PROC-* alerts"
    sample_questions:
      - "Open repair orders exceeding lead time?"
      - "Most common shop findings for ATA 73?"
      - "Fault confirmation rate by ATA chapter?"

