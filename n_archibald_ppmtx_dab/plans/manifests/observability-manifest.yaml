# =============================================================================
# Lakehouse Monitors
# =============================================================================
lakehouse_monitors:
  # Fact table monitors (TimeSeries)
  - table_name: qx_ppmtx_gold_fact_component_removal
    monitor_type: TimeSeries
    timestamp_column: transaction_date_key
    domain: component_lifecycle
    use_case_refs: [UC-001]
    custom_metrics:
      - name: component_total_removals
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(*)"
        description: "Total removal events"
      - name: component_unscheduled_ratio
        type: DERIVED
        input_columns: [":table"]
        definition: "COUNT(CASE WHEN schedule_category = 'Unscheduled' THEN 1 END) / NULLIF(COUNT(*), 0)"
        description: "Unscheduled removal ratio"
      - name: component_avg_hours_at_removal
        type: AGGREGATE
        input_columns: [":table"]
        definition: "AVG(hours_installed)"
        description: "Average hours at removal"
    slicing_exprs: [schedule_category, transaction_type, reason_category]

  - table_name: qx_ppmtx_gold_fact_defect
    monitor_type: TimeSeries
    timestamp_column: reported_date_key
    domain: defect_intelligence
    use_case_refs: [UC-002, UC-003]
    custom_metrics:
      - name: defect_total_count
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(*)"
        description: "Total defect events"
      - name: defect_delay_rate
        type: DERIVED
        input_columns: [":table"]
        definition: "COUNT(CASE WHEN delay = 'Y' THEN 1 END) / NULLIF(COUNT(*), 0)"
        description: "Delay rate"
      - name: defect_total_delay_minutes
        type: AGGREGATE
        input_columns: [":table"]
        definition: "SUM(delay_minutes)"
        description: "Total delay minutes"
      - name: defect_cancel_count
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(CASE WHEN cancellation = 'Y' THEN 1 END)"
        description: "Cancellation count"
      - name: defect_ifsd_count
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(CASE WHEN i_f_s_d = 'Y' THEN 1 END)"
        description: "IFSD event count"
    slicing_exprs: [defect_type, defect_category, status]

  - table_name: qx_ppmtx_gold_fact_inventory_transaction
    monitor_type: TimeSeries
    timestamp_column: transaction_date_key
    domain: inventory_spares
    use_case_refs: [UC-007]
    custom_metrics:
      - name: inventory_movement_count
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(*)"
        description: "Total movement events"
      - name: inventory_total_qty
        type: AGGREGATE
        input_columns: [":table"]
        definition: "SUM(qty)"
        description: "Total quantity moved"
    slicing_exprs: [transaction_type, condition]

  - table_name: qx_ppmtx_gold_fact_order
    monitor_type: TimeSeries
    timestamp_column: order_date_key
    domain: procurement_overhaul
    use_case_refs: [UC-008]
    custom_metrics:
      - name: order_total_cost
        type: AGGREGATE
        input_columns: [":table"]
        definition: "SUM(exchange_repair_cost)"
        description: "Total order cost"
      - name: order_avg_lead_time
        type: AGGREGATE
        input_columns: [":table"]
        definition: "AVG(lead_time)"
        description: "Average lead time"
      - name: order_fulfillment_rate
        type: DERIVED
        input_columns: [":table"]
        definition: "SUM(qty_received) / NULLIF(SUM(qty_require), 0)"
        description: "Order fulfillment rate"
    slicing_exprs: [order_type, status]

  - table_name: qx_ppmtx_gold_fact_teardown
    monitor_type: TimeSeries
    timestamp_column: created_date_key
    domain: procurement_overhaul
    use_case_refs: [UC-009]
    custom_metrics:
      - name: teardown_total_count
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(*)"
        description: "Total teardown reports"
      - name: teardown_fault_confirm_rate
        type: DERIVED
        input_columns: [":table"]
        definition: "COUNT(CASE WHEN fault_confirm = 'Y' THEN 1 END) / NULLIF(COUNT(*), 0)"
        description: "Fault confirmation rate"
    slicing_exprs: [fault_confirm, status]

  # Snapshot monitors
  - table_name: qx_ppmtx_gold_fact_inventory_snapshot
    monitor_type: Snapshot
    domain: inventory_spares
    use_case_refs: [UC-006]
    custom_metrics:
      - name: snapshot_total_instances
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(*)"
        description: "Total inventory positions"
      - name: snapshot_total_value
        type: AGGREGATE
        input_columns: [":table"]
        definition: "SUM(unit_cost)"
        description: "Total inventory value"
      - name: snapshot_serviceable_ratio
        type: DERIVED
        input_columns: [":table"]
        definition: "COUNT(CASE WHEN condition = 'SVC' THEN 1 END) / NULLIF(COUNT(*), 0)"
        description: "Serviceable ratio"

  - table_name: qx_ppmtx_gold_fact_inventory_control
    monitor_type: Snapshot
    domain: inventory_spares
    use_case_refs: [UC-005]
    custom_metrics:
      - name: control_total_records
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(*)"
        description: "Total controlled parts"
      - name: control_critical_count
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(CASE WHEN remaining_cycles < 1000 OR remaining_hours < 2000 THEN 1 END)"
        description: "Parts near red-line"

  - table_name: qx_ppmtx_gold_bridge_defect_part
    monitor_type: Snapshot
    domain: defect_intelligence
    use_case_refs: [UC-004]
    custom_metrics:
      - name: bridge_record_count
        type: AGGREGATE
        input_columns: [":table"]
        definition: "COUNT(*)"
        description: "Defect-part linkage count"

  - table_name: qx_ppmtx_gold_dim_part
    monitor_type: Snapshot
    domain: part_master
    use_case_refs: []

  - table_name: qx_ppmtx_gold_dim_aircraft
    monitor_type: Snapshot
    domain: component_lifecycle
    use_case_refs: []

  - table_name: qx_ppmtx_gold_dim_station
    monitor_type: Snapshot
    domain: component_lifecycle
    use_case_refs: []

  - table_name: qx_ppmtx_gold_dim_ata_chapter
    monitor_type: Snapshot
    domain: defect_intelligence
    use_case_refs: []

  - table_name: qx_ppmtx_gold_dim_date
    monitor_type: Snapshot
    domain: common
    use_case_refs: []

