# =============================================================================
# Feature Tables
# =============================================================================
feature_tables:
  - name: component_lifecycle_features
    description: "Features for component removal rate forecasting"
    primary_keys: [pn, feature_month]
    source_gold_tables:
      - qx_ppmtx_gold_fact_component_removal
      - qx_ppmtx_gold_dim_part
      - qx_ppmtx_gold_dim_date
    features:
      - name: removal_count_30d
        type: INT
        description: "Removals in the last 30 days for this P/N"
        derivation: "COUNT(*) WHERE calendar_date >= feature_month - 30"
      - name: removal_count_90d
        type: INT
        description: "Removals in the last 90 days for this P/N"
        derivation: "COUNT(*) WHERE calendar_date >= feature_month - 90"
      - name: avg_hours_at_removal_90d
        type: DOUBLE
        description: "Average hours_installed at removal, 90-day window"
        derivation: "AVG(hours_installed) WHERE calendar_date >= feature_month - 90"
      - name: avg_cycles_at_removal_90d
        type: DOUBLE
        description: "Average cycles_installed at removal, 90-day window"
        derivation: "AVG(cycles_installed) WHERE calendar_date >= feature_month - 90"
      - name: unscheduled_ratio_90d
        type: DOUBLE
        description: "Unscheduled / total removals, 90-day window"
        derivation: "COUNT(CASE WHEN schedule_category = 'Unscheduled') / NULLIF(COUNT(*), 0)"
      - name: removal_velocity_trend
        type: DOUBLE
        description: "Slope of removal count over last 6 months"
        derivation: "Linear regression slope on monthly removal counts"
      - name: fleet_penetration
        type: DOUBLE
        description: "Fraction of fleet tails with at least one removal of this P/N"
        derivation: "COUNT(DISTINCT ac) / total_fleet_size"
      - name: category
        type: STRING
        description: "Part category from dim_part"
        derivation: "dim_part.category"

  - name: defect_intelligence_features
    description: "Features for defect anomaly detection"
    primary_keys: [chapter, section, feature_week]
    source_gold_tables:
      - qx_ppmtx_gold_fact_defect
      - qx_ppmtx_gold_dim_ata_chapter
      - qx_ppmtx_gold_dim_date
    features:
      - name: defect_count_7d
        type: INT
        description: "Defects in last 7 days for this ATA section"
        derivation: "COUNT(*) WHERE calendar_date >= feature_week - 7"
      - name: defect_count_30d
        type: INT
        description: "Defects in last 30 days for this ATA section"
        derivation: "COUNT(*) WHERE calendar_date >= feature_week - 30"
      - name: delay_minutes_30d
        type: DOUBLE
        description: "Total delay minutes, 30-day window"
        derivation: "SUM(delay_minutes) WHERE calendar_date >= feature_week - 30"
      - name: cancellation_count_30d
        type: INT
        description: "Cancellation count, 30-day window"
        derivation: "COUNT(CASE WHEN cancellation = 'Y') WHERE calendar_date >= feature_week - 30"
      - name: ifsd_count_90d
        type: INT
        description: "IFSD events, 90-day window"
        derivation: "COUNT(CASE WHEN i_f_s_d = 'Y') WHERE calendar_date >= feature_week - 90"
      - name: deferral_rate_30d
        type: DOUBLE
        description: "Deferral count / total defects, 30-day window"
        derivation: "COUNT(CASE WHEN defer = 'Y') / NULLIF(COUNT(*), 0)"
      - name: defect_volume_z_score
        type: DOUBLE
        description: "Current week count vs 12-week rolling avg"
        derivation: "(current_week - rolling_avg) / NULLIF(rolling_stddev, 0)"
      - name: delay_impact_trend
        type: DOUBLE
        description: "Slope of delay minutes over last 6 months"
        derivation: "Linear regression slope on monthly delay minutes"

# =============================================================================
# Models
# =============================================================================
models:
  - name: removal_rate_forecaster
    domain: component_lifecycle
    description: "Predicts monthly component removal rate by P/N for spare positioning optimization"
    model_type: regression
    algorithm: XGBRegressor
    feature_table: component_lifecycle_features
    label_column: removal_count_next_30d
    label_type: INT
    label_derivation: "Forward-looking 30-day removal count from fact_component_removal"
    training_window_months: 24
    retraining_cadence: monthly
    validation_strategy: "Time-series split (months 1-18 train, 19-24 validate)"
    business_questions:
      - "Which part numbers will have the highest removal volume next month?"
      - "Should we pre-position spares based on predicted removal rates?"
      - "What is the forecasted demand for high-value rotables in Q3?"
    success_metrics:
      - name: MAE
        target: "< 2 removals per P/N per month"
      - name: MAPE
        target: "< 25% for top 50 P/Ns by volume"
    use_case_refs: [UC-001, UC-006]

  - name: defect_anomaly_detector
    domain: defect_intelligence
    description: "Detects anomalous defect patterns by ATA section for early warning"
    model_type: anomaly_detection
    algorithm: IsolationForest
    feature_table: defect_intelligence_features
    label_column: null
    label_type: null
    label_derivation: "Unsupervised — outputs anomaly_score; threshold at 95th percentile"
    training_window_months: 12
    retraining_cadence: quarterly
    validation_strategy: "Contamination parameter 0.05; validated against known reliability events"
    business_questions:
      - "Any unusual defect patterns emerging this week?"
      - "Which ATA sections are behaving anomalously?"
      - "Is the ATA 73 spike a true anomaly or normal variation?"
    success_metrics:
      - name: Precision
        target: "> 80%"
      - name: Recall
        target: "> 70% for known IFSD-preceding clusters"
    use_case_refs: [UC-002, UC-003]

