# =============================================================================
# Domains
# =============================================================================
domains:
  component_lifecycle:
    description: "Component removal trending, MTBUR analysis, time-on-wing distribution, and reliability metrics for propulsion parts."
    gold_tables:
      - qx_ppmtx_gold_fact_component_removal
      - qx_ppmtx_gold_dim_part
      - qx_ppmtx_gold_dim_aircraft
      - qx_ppmtx_gold_dim_station
      - qx_ppmtx_gold_dim_ata_chapter
      - qx_ppmtx_gold_dim_date
    source_assets: []

    metric_views:
      - name: component_lifecycle_analytics_metrics
        source_table: qx_ppmtx_gold_fact_component_removal
        dimensions_joined:
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_aircraft
          - qx_ppmtx_gold_dim_station
          - qx_ppmtx_gold_dim_ata_chapter
          - qx_ppmtx_gold_dim_date
        measures:
          - name: total_hours_at_removal
            expression: "SUM(hours_installed)"
          - name: total_cycles_at_removal
            expression: "SUM(cycles_installed)"
          - name: removal_count
            expression: "COUNT(*)"
          - name: avg_hours_at_removal
            expression: "AVG(hours_installed)"
          - name: avg_cycles_at_removal
            expression: "AVG(cycles_installed)"
          - name: unscheduled_removal_count
            expression: "COUNT(CASE WHEN schedule_category = 'Unscheduled' THEN 1 END)"
        business_questions:
          - "How many removals this month?"
          - "Average hours at removal for rotables?"
          - "Removal trend by ATA chapter?"
        use_case_refs:
          - UC-001
          - UC-010

    tvfs:
      - name: get_component_removal_history
        parameters:
          - name: part_number
            type: STRING
            description: "Part number filter (NULL for all)"
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD)"
          - name: station_code
            type: STRING
            description: "Station code filter (NULL for all)"
        gold_tables_used:
          - qx_ppmtx_gold_fact_component_removal
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_aircraft
          - qx_ppmtx_gold_dim_station
          - qx_ppmtx_gold_dim_ata_chapter
          - qx_ppmtx_gold_dim_date
        business_questions:
          - "Show all removals for part X at PDX in the last 6 months"
          - "What is the removal history for engine serial number Y?"
        use_case_refs:
          - UC-001

      - name: get_mtbur_analysis
        parameters:
          - name: part_number
            type: STRING
            description: "Part number (NULL for all)"
          - name: lookback_months
            type: INT
            description: "Months to look back"
          - name: schedule_filter
            type: STRING
            description: "UNSCHEDULED, SCHEDULED, or ALL"
        gold_tables_used:
          - qx_ppmtx_gold_fact_component_removal
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_date
        business_questions:
          - "What is the MTBUR for HPT shroud P/N?"
          - "Which parts have the lowest MTBUR?"
        use_case_refs:
          - UC-001
          - UC-010

      - name: get_time_on_wing_distribution
        parameters:
          - name: part_number
            type: STRING
            description: "Part number"
          - name: metric
            type: STRING
            description: "HOURS, CYCLES, or DAYS"
          - name: bin_width
            type: DECIMAL
            description: "Histogram bin width"
        gold_tables_used:
          - qx_ppmtx_gold_fact_component_removal
          - qx_ppmtx_gold_dim_part
        business_questions:
          - "Show hours-at-failure distribution for P/N X"
          - "Cycles-at-removal pattern for hot-section parts?"
        use_case_refs:
          - UC-001

  defect_intelligence:
    description: "Defect trending by ATA chapter, operational impact attribution, defect-to-part linkage, and deferral analysis."
    gold_tables:
      - qx_ppmtx_gold_fact_defect
      - qx_ppmtx_gold_bridge_defect_part
      - qx_ppmtx_gold_dim_ata_chapter
      - qx_ppmtx_gold_dim_aircraft
      - qx_ppmtx_gold_dim_date
    source_assets: []

    metric_views:
      - name: defect_intelligence_analytics_metrics
        source_table: qx_ppmtx_gold_fact_defect
        dimensions_joined:
          - qx_ppmtx_gold_dim_aircraft
          - qx_ppmtx_gold_dim_ata_chapter
          - qx_ppmtx_gold_dim_date
        measures:
          - name: defect_count
            expression: "COUNT(*)"
          - name: total_delay_minutes
            expression: "SUM(delay_minutes)"
          - name: total_delay_hours
            expression: "SUM(delays_hours)"
          - name: cancellation_count
            expression: "COUNT(CASE WHEN cancellation = 'Y' THEN 1 END)"
          - name: delay_event_count
            expression: "COUNT(CASE WHEN delay = 'Y' THEN 1 END)"
          - name: ifsd_count
            expression: "COUNT(CASE WHEN i_f_s_d = 'Y' THEN 1 END)"
          - name: mel_deferral_count
            expression: "COUNT(CASE WHEN mel = 'Y' THEN 1 END)"
          - name: deferral_count
            expression: "COUNT(CASE WHEN defer = 'Y' THEN 1 END)"
        business_questions:
          - "Top ATA sections by delay minutes?"
          - "Defect count trend this quarter?"
          - "Cancellation count by ATA chapter?"
        use_case_refs:
          - UC-002
          - UC-003
          - UC-010

    tvfs:
      - name: get_defect_trending_by_ata
        parameters:
          - name: ata_chapter
            type: DECIMAL
            description: "ATA chapter (NULL for all)"
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD)"
          - name: granularity
            type: STRING
            description: "WEEK or MONTH"
        gold_tables_used:
          - qx_ppmtx_gold_fact_defect
          - qx_ppmtx_gold_dim_ata_chapter
          - qx_ppmtx_gold_dim_date
        business_questions:
          - "Which ATA chapters trending up this month?"
          - "ATA 73 defect trend weekly for 6 months"
        use_case_refs:
          - UC-002
          - UC-003
          - UC-010

      - name: get_operational_impact_summary
        parameters:
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD)"
          - name: group_by
            type: STRING
            description: "ATA, AIRCRAFT, or ALL"
          - name: top_n
            type: INT
            description: "Top N results"
        gold_tables_used:
          - qx_ppmtx_gold_fact_defect
          - qx_ppmtx_gold_dim_aircraft
          - qx_ppmtx_gold_dim_ata_chapter
          - qx_ppmtx_gold_dim_date
        business_questions:
          - "Top 10 ATA sections by delay minutes this month"
          - "Cancellations from propulsion issues this quarter?"
        use_case_refs:
          - UC-003
          - UC-010

      - name: get_defect_part_linkage
        parameters:
          - name: defect_id
            type: STRING
            description: "Defect number (NULL to search by part)"
          - name: part_number
            type: STRING
            description: "Part number (NULL to search by defect)"
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD)"
        gold_tables_used:
          - qx_ppmtx_gold_fact_defect
          - qx_ppmtx_gold_bridge_defect_part
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_fact_teardown
        business_questions:
          - "Parts implicated in defect X with shop findings?"
          - "Complete defect history for part number Y"
        use_case_refs:
          - UC-004

  inventory_spares:
    description: "Spare positioning, LLP red-line tracking, stock-out risk identification, and inventory movement analytics."
    gold_tables:
      - qx_ppmtx_gold_fact_inventory_snapshot
      - qx_ppmtx_gold_fact_inventory_transaction
      - qx_ppmtx_gold_fact_inventory_control
      - qx_ppmtx_gold_dim_part
      - qx_ppmtx_gold_dim_station
      - qx_ppmtx_gold_dim_date
    source_assets: []

    metric_views:
      - name: inventory_spares_analytics_metrics
        source_table: qx_ppmtx_gold_fact_inventory_snapshot
        dimensions_joined:
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_station
        measures:
          - name: instance_count
            expression: "COUNT(*)"
          - name: total_value
            expression: "SUM(unit_cost)"
          - name: serviceable_count
            expression: "COUNT(CASE WHEN condition = 'SVC' THEN 1 END)"
          - name: unserviceable_count
            expression: "COUNT(CASE WHEN condition = 'UNS' THEN 1 END)"
          - name: aog_count
            expression: "COUNT(CASE WHEN condition = 'AOG' THEN 1 END)"
          - name: installed_count
            expression: "COUNT(CASE WHEN installed_ac IS NOT NULL THEN 1 END)"
          - name: in_stock_count
            expression: "COUNT(CASE WHEN installed_ac IS NULL THEN 1 END)"
        business_questions:
          - "How many serviceable spares at PDX?"
          - "Total inventory value by condition?"
        use_case_refs:
          - UC-006
          - UC-007

    tvfs:
      - name: get_spare_availability_by_station
        parameters:
          - name: part_number
            type: STRING
            description: "Part number (NULL for all)"
          - name: station
            type: STRING
            description: "Station code (NULL for all)"
          - name: condition_filter
            type: STRING
            description: "Condition code filter (NULL for all)"
        gold_tables_used:
          - qx_ppmtx_gold_fact_inventory_snapshot
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_station
        business_questions:
          - "Serviceable spares of P/N X at PDX?"
          - "Parts with fewer than 2 serviceable spares?"
        use_case_refs:
          - UC-006

      - name: get_llp_redline_status
        parameters:
          - name: remaining_cycles_threshold
            type: DECIMAL
            description: "Cycles threshold (e.g., 1000)"
          - name: remaining_hours_threshold
            type: DECIMAL
            description: "Hours threshold (e.g., 2000)"
          - name: control_type
            type: STRING
            description: "Control type filter (NULL for all)"
        gold_tables_used:
          - qx_ppmtx_gold_fact_inventory_control
          - qx_ppmtx_gold_dim_part
        business_questions:
          - "LLPs with fewer than 1000 cycles remaining?"
          - "Fleet scan for parts near hard limit?"
        use_case_refs:
          - UC-005

      - name: get_inventory_movement_velocity
        parameters:
          - name: part_number
            type: STRING
            description: "Part number (NULL for all)"
          - name: station
            type: STRING
            description: "Station code (NULL for all)"
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD)"
          - name: transaction_type_filter
            type: STRING
            description: "Transaction type (NULL for all)"
        gold_tables_used:
          - qx_ppmtx_gold_fact_inventory_transaction
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_station
          - qx_ppmtx_gold_dim_date
        business_questions:
          - "Removal velocity for high-value rotables?"
          - "Top 10 P/Ns by transaction volume this month?"
        use_case_refs:
          - UC-007

  procurement_overhaul:
    description: "Procurement order tracking, repair cost analytics, shop findings, and teardown root cause analysis."
    gold_tables:
      - qx_ppmtx_gold_fact_order
      - qx_ppmtx_gold_fact_teardown
      - qx_ppmtx_gold_dim_part
      - qx_ppmtx_gold_dim_ata_chapter
      - qx_ppmtx_gold_dim_date
    source_assets: []

    metric_views:
      - name: procurement_overhaul_analytics_metrics
        source_table: qx_ppmtx_gold_fact_order
        dimensions_joined:
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_date
        measures:
          - name: total_repair_cost
            expression: "SUM(exchange_repair_cost)"
          - name: avg_repair_cost
            expression: "AVG(exchange_repair_cost)"
          - name: total_qty_required
            expression: "SUM(qty_require)"
          - name: total_qty_received
            expression: "SUM(qty_received)"
          - name: avg_lead_time
            expression: "AVG(lead_time)"
          - name: order_line_count
            expression: "COUNT(*)"
          - name: open_order_count
            expression: "COUNT(CASE WHEN status = 'Open' THEN 1 END)"
          - name: fulfillment_rate
            expression: "SUM(qty_received) / NULLIF(SUM(qty_require), 0)"
        business_questions:
          - "Average repair cost by order type?"
          - "Order fulfillment rate trend?"
        use_case_refs:
          - UC-008
          - UC-009
          - UC-010

    tvfs:
      - name: get_order_status_summary
        parameters:
          - name: order_type_filter
            type: STRING
            description: "Order type (NULL for all)"
          - name: status_filter
            type: STRING
            description: "Status filter (NULL for all)"
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD)"
        gold_tables_used:
          - qx_ppmtx_gold_fact_order
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_date
        business_questions:
          - "Open orders exceeding lead time?"
          - "Total repair cost by order type this quarter?"
        use_case_refs:
          - UC-008

      - name: get_shop_findings_by_part
        parameters:
          - name: part_number
            type: STRING
            description: "Part number (NULL for all)"
          - name: ata_chapter
            type: DECIMAL
            description: "ATA chapter (NULL for all)"
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD)"
        gold_tables_used:
          - qx_ppmtx_gold_fact_teardown
          - qx_ppmtx_gold_dim_part
          - qx_ppmtx_gold_dim_ata_chapter
        business_questions:
          - "Most common shop findings for ATA 73?"
          - "Fault confirmation rate by ATA chapter?"
        use_case_refs:
          - UC-004
          - UC-009

