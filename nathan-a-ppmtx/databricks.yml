bundle:
  name: nathan-a-ppmtx

resources:
  apps:
    app:
      name: "nathan-a-ppmtx"
      description: "QX Propulsion Predictive Maintenance app"
      source_code_path: ./
      # Binds the app's Service Principal to the existing Lakebase Autoscaling
      # project `nathan-a-ppmtx` so the platform injects LAKEBASE_ENDPOINT/PG* at
      # runtime (resolves `valueFrom: postgres` in app.yaml). The synced Gold
      # tables live in Postgres schema `an_maintenanceengineering_ods`.
      resources:
        - name: "postgres"
          postgres:
            branch: "projects/nathan-a-ppmtx/branches/production"
            database: "projects/nathan-a-ppmtx/branches/production/databases/databricks-postgres"
            permission: "CAN_CONNECT_AND_CREATE"
        # Genie space binding: grants app SP CAN_RUN permission as a safety net.
        # Queries always execute as the logged-in user (via .asUser(req) in handleGenieQuery),
        # but this resource binding ensures the app SP has permission if needed for fallback.
        - name: "genie-space"
          genie_space:
            name: "Propulsion Reliability Intelligence"
            space_id: "01f1763c5f6c1b2789524816da865544"
            permission: "CAN_RUN"
      # On-behalf-of-user API scopes. The Assistant tab invokes Genie, which must
      # run as the signed-in user (who holds Genie/warehouse/UC access) rather than
      # the app SP.
      user_api_scopes:
        - genie
        - sql

targets:
  default:
    default: true
    workspace:
      host: https://adb-620317033646362.2.azuredatabricks.net
      profile: adb-620317033646362
