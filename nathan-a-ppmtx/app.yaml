command: ['npm', 'run', 'start']
env:
  # Auto-injected by the platform from the app.resources.postgres binding in databricks.yml
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # Postgres schema that holds the synced Gold tables (qx_ppmtx_synced_gold_*)
  - name: DB_SCHEMA
    value: 'an_maintenanceengineering_ods'
  # Genie Space ID for the "Propulsion Reliability Intelligence" space.
  # Queries execute under the logged-in user's OBO token for Unity Catalog access.
  - name: DATABRICKS_GENIE_SPACE_ID
    value: '01f1763c5f6c1b2789524816da865544'
